<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빵집 생성 직전 시트</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 장면 묶음 → 구도 카드(스틸 · 근거 · 첨부 실사진 · 프롬프트). 라이트 고정 */
:root{--bg:#f4f1ec;--card:#fffdf9;--ink:#26211c;--mute:#7a7066;--line:#e4dccf;--accent:#9b5a22;--soft:#f1e3d2;--ok:#2f7a4e;--warn:#b5832a;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:grid;gap:18px}
h1{margin:0;font-size:24px;text-wrap:balance}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav a{flex:none;text-decoration:none;color:var(--ink);font-family:var(--mono);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.st{font-size:12px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}.dot.on{background:var(--ok)}.dot.off{background:#b9483a}
section.scene{display:grid;gap:10px;scroll-margin-top:56px}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.sh h2{margin:0;font-size:18px}.sh .sid{font-family:var(--mono);color:var(--accent);font-weight:500}.sh .act{color:var(--mute);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.pv{position:relative;display:block;border-radius:8px;overflow:hidden;background:#ddd6cb;aspect-ratio:9/16;max-width:100%}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.code{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:13px;background:rgba(255,253,249,.92);color:var(--ink);padding:2px 9px;border-radius:999px}
.mod{position:absolute;right:8px;top:8px;font-size:11.5px;font-weight:700;background:var(--ok);color:#fff;padding:2px 8px;border-radius:999px}
.open{position:absolute;left:8px;bottom:8px;font-size:12.5px;font-weight:600;background:var(--ink);color:#fff;padding:5px 11px;border-radius:999px}
.desc{font-size:13px}
.lab{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.lab button{margin-left:auto}
.ev,.ph{display:flex;gap:6px;flex-wrap:wrap}
.ev img{width:58px;height:58px;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block}
.p{position:relative;width:70px}
.p img{width:70px;height:70px;object-fit:cover;border-radius:6px;display:block;cursor:zoom-in;border:2px solid transparent}
.p.att img{border-color:var(--accent)}
.p .n{position:absolute;left:3px;bottom:3px;font-family:var(--mono);font-size:10.5px;background:var(--accent);color:#fff;border-radius:4px;padding:0 4px}
.p .x{position:absolute;right:-5px;top:-5px;width:22px;height:22px;border-radius:50%;border:0;background:#26211c;color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.p .x:focus-visible,.btn:focus-visible,.pv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
details summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px;line-height:1.55;background:#f2ece3;border-radius:8px;padding:9px 10px;max-height:260px;overflow:auto}
.refs{font-size:12px;color:var(--mute)}
.poses{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pose{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:5px;align-content:start}
.pose img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block}
.pose b{font-family:var(--mono);color:var(--accent)}
.pose .t{font-size:12.5px}.pose .c{font-size:11.5px;color:var(--mute)}
.up{font-size:11px;font-weight:700;color:var(--ok)}
#lb[hidden],#toast[hidden]{display:none}
#lb{position:fixed;inset:0;z-index:30;background:rgba(20,17,14,.9);display:grid;place-items:center;padding:16px}
#lb img{max-width:100%;max-height:88vh;border-radius:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#26211c;color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;z-index:40}

@media (max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div class="wrap">
  <header style="display:grid;gap:6px"><h1>빵집 생성 직전 시트</h1><div class="st" id="st"><span class="dot" id="sd"></span><span id="stt">불러오는 중</span></div></header>
  <nav id="nav"></nav>
  <main id="main" style="display:grid;gap:26px"></main>
</div>
<div id="lb" hidden><img id="lbi" alt=""></div><div id="toast" hidden></div>
<script>
const SB={url:'https://newoydegfbnnqujgiips.supabase.co',key:'sb_publishable_6remFFz9oGKffdlRakvdfg_OOLp6zYL'};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,LIVE={},REF={};let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}
async function rpc(fn,body){const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null}
async function sync(){try{const [a,b]=await Promise.all([rpc('previz_load',{p_project:'v16'}),rpc('previz_load',{p_project:'v16sheet'})]);LIVE={};REF={};
  for(const r of a||[])if(r&&r.id&&r.doc)LIVE[r.id]=r.doc;for(const r of b||[])if(r&&r.id&&r.doc)REF[r.id]=r.doc;
  $('#sd').className='dot on';$('#stt').textContent='저장소 연결됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});render()}
  catch(e){$('#sd').className='dot off';$('#stt').textContent='저장소 연결 실패 · 처음 구도로 보여줌';render()}}
function info(id){const ini=D.shots[id].init;const doc=LIVE['shot:'+id];const s=doc&&doc.sheet;if(s&&s.still&&(!ini||s.t>ini.t))return {...s,mod:true};return {...ini,mod:false}}
function refDoc(id){return REF['sheetref:'+id]||{removed:[],added:[],hist:[]}}
const W=k=>k.startsWith('prop:')?3:k.startsWith('bread')?2:1;
function photos(id,vis){const rd=refDoc(id);const rm=new Set(rd.removed||[]);const seen=new Set();const L=[];
  for(const a of rd.added||[]){if(seen.has(a.id))continue;seen.add(a.id);L.push({...a,key:'added'})}
  const items=[];for(const v of vis||[]){if(D.skip.includes(v.k))continue;if(v.k.startsWith('breads:')){v.k.slice(7).split(',').slice(0,2).forEach(t=>items.push({k:'bread:'+t,s:v.f/2*W('bread')}))}else items.push({k:v.k,s:v.f*W(v.k)})}
  items.sort((a,b)=>b.s-a.s);for(const it of items){const e=D.lib[it.k];if(!e)continue;for(const p of e.photos){if(seen.has(p.id))continue;seen.add(p.id);L.push({...p,key:it.k,label:e.label})}}
  return {all:L.filter(p=>!rm.has(p.id)),rmCount:rm.size}}
function prompt(id,inf,att){const sc=D.shots[id];const n0=inf.ceil?4:3;
  const note=att.length?' '+att.map((p,i)=>`Use <<<image_${n0+i}>>> only for ${p.label||'that object'}`).join(', ')+'; do not copy hands, people, background, or framing from them.':'';
  return [D.recipe.front,inf.frame,D.recipe.mat[sc.zone],inf.ceil?D.recipe.ceilLine:'',sc.person+note,D.recipe.end].filter(Boolean).join(' ')}
async function saveRef(id,rd){rd.t=Date.now();REF['sheetref:'+id]=rd;render();try{await rpc('previz_save',{p_project:'v16sheet',p_id:'sheetref:'+id,p_doc:rd})}catch(e){toast('저장 실패 · 다시 눌러 주세요')}}
function rmPhoto(id,pid){const rd=JSON.parse(JSON.stringify(refDoc(id)));rd.removed=[...(rd.removed||[]),pid];rd.hist=[...(rd.hist||[]),['rm',pid]];saveRef(id,rd);toast('사진 뺐어요')}
function undo(id){const rd=JSON.parse(JSON.stringify(refDoc(id)));const h=(rd.hist||[]).pop();if(!h)return;if(h[0]==='rm')rd.removed=(rd.removed||[]).filter(x=>x!==h[1]);saveRef(id,rd);toast('되돌렸어요')}
function card(id){const sc=D.shots[id];const inf=info(id);const ph=photos(id,inf.vis);const att=ph.all.slice(0,2);const pr=prompt(id,inf,att);const rd=refDoc(id);
  const refs=['1 프리비즈 스틸','2 캐릭터시트',...(inf.ceil?['3 천장등 사진']:[]),...att.map((p,i)=>`${(inf.ceil?4:3)+i} ${p.label||'실사진'}`)];
  return `<article class="card" id="c-${esc(id)}">
  <a class="pv" href="index.html#shot=${esc(id)}&from=sheet"><img src="${esc(inf.still)}" alt="${esc(id)} 프리비즈" loading="lazy"><span class="code">${esc(id)}</span>${inf.mod?'<span class="mod">수정됨</span>':''}<span class="open">3D에서 구도 바꾸기</span></a>
  <div class="desc">${esc(sc.desc)}</div>
  ${sc.ev&&sc.ev.length?`<div class="lab">실제 브이로그 근거</div><div class="ev">${sc.ev.map(e=>`<img src="${esc(e)}" alt="근거 사진" loading="lazy" data-z="${esc(e)}">`).join('')}</div>`:''}
  <div class="lab">첨부 실사진<button class="btn" type="button" data-undo="${esc(id)}" ${(rd.hist||[]).length?'':'disabled'}>되돌리기</button></div>
  <div class="ph">${ph.all.slice(0,6).map((p,i)=>`<div class="p ${i<2?'att':''}"><img src="${esc(p.url)}" alt="${esc(p.label||'')}" loading="lazy" data-z="${esc(p.url)}">${i<2?`<span class="n">${(inf.ceil?4:3)+i}</span>`:''}<button class="x" type="button" aria-label="이 사진 빼기" data-rm="${esc(id)}" data-pid="${esc(p.id)}">×</button></div>`).join('')||'<span class="refs">보이는 물건의 실사진 없음</span>'}</div>
  <div class="refs">${esc(refs.join(' · '))}</div>
  <details><summary>프롬프트 ${pr.length}자</summary><pre>${esc(pr)}</pre><button class="btn" type="button" data-cp="${esc(id)}" style="margin-top:6px">복사</button></details>
  </article>`}
let PR={};
function render(){if(!D)return;const scroll=window.scrollY;PR={};
  $('#nav').innerHTML=D.groups.map(g=>`<a href="#${esc(g.sid)}">${esc(g.sid)}</a>`).join('')+(D.poses.length?'<a href="#poses">포즈 후보</a>':'');
  $('#main').innerHTML=D.groups.map(g=>`<section class="scene" id="${esc(g.sid)}"><div class="sh"><span class="sid">${esc(g.sid)}</span><h2>${esc(g.name)}</h2><span class="act">${esc(g.act)}</span></div><div class="cards">${g.ids.map(card).join('')}</div></section>`).join('')+
   (D.poses.length?`<section class="scene" id="poses"><div class="sh"><span class="sid">P</span><h2>카메라 보고 짓는 포즈 후보</h2></div><div class="poses">${D.poses.map(p=>`<div class="pose"><img src="${esc(p.img)}" alt="${esc(p.id)}" loading="lazy" data-z="${esc(p.img)}"><div><b>${esc(p.id)}</b> ${p.up?'<span class="up">올려봄 확인</span>':''}</div><div class="t">${esc(p.scene)}</div><div class="c">${esc(p.where)} · ${esc(p.cam)}</div><a class="c" href="${esc(p.src)}" target="_blank" rel="noopener">출처</a></div>`).join('')}</div></section>`:'');
  for(const g of D.groups)for(const id of g.ids){const inf=info(id);const att=photos(id,inf.vis).all.slice(0,2);PR[id]=prompt(id,inf,att)}
  window.scrollTo(0,scroll);if(location.hash&&!render.jumped){const el=document.getElementById('c-'+location.hash.slice(1))||document.getElementById(location.hash.slice(1));if(el){el.scrollIntoView({block:'start'});render.jumped=true}}}
document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.rm){e.preventDefault();rmPhoto(t.dataset.rm,t.dataset.pid);return}
  if(t.dataset.undo){undo(t.dataset.undo);return}
  if(t.dataset.cp){const s=PR[t.dataset.cp];navigator.clipboard.writeText(s).then(()=>toast('프롬프트 복사됨'),()=>{const r=document.createRange();r.selectNodeContents(t.parentElement.querySelector('pre'));const g=getSelection();g.removeAllRanges();g.addRange(r);toast('선택해 뒀어요 · Ctrl+C')});return}
  if(t.dataset.z){$('#lbi').src=t.dataset.z;$('#lb').hidden=false;return}});
$('#lb').addEventListener('click',()=>$('#lb').hidden=true);document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').hidden=true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});window.addEventListener('pageshow',e=>{if(e.persisted)sync()});setInterval(sync,30000);
fetch('sheet_data.json?v='+Date.now()).then(r=>r.json()).then(j=>{D=j;render();sync()});
</script></body></html>
